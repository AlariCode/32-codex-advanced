basePath: /
definitions:
  httpapi.errorResponse:
    properties:
      code:
        type: string
    type: object
  httpapi.healthResponse:
    properties:
      status:
        type: string
    type: object
  httpapi.loginRequestBody:
    properties:
      email:
        format: email
        maxLength: 254
        type: string
      password:
        format: password
        type: string
    required:
    - email
    - password
    type: object
  httpapi.registerRequest:
    properties:
      email:
        format: email
        maxLength: 254
        type: string
      password:
        format: password
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  httpapi.saveLinkRequest:
    properties:
      url:
        type: string
    type: object
  httpapi.saveLinkResponse:
    properties:
      created:
        type: boolean
      link:
        $ref: '#/definitions/link.Card'
      server_time:
        type: string
    type: object
  link.Card:
    properties:
      can_read:
        type: boolean
      created_at:
        type: string
      deadline_at:
        type: string
      generation:
        type: integer
      id:
        type: string
      reason:
        type: string
      requested_at:
        type: string
      state:
        type: string
      submitted_url:
        type: string
      title:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  link.Page:
    properties:
      links:
        items:
          $ref: '#/definitions/link.Card'
        type: array
      next_cursor:
        type: string
      server_time:
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
    type: object
info:
  contact: {}
  description: Linkbook user registration and process health.
  title: Linkbook API
  version: 0.1.0
paths:
  /api/links:
    get:
      parameters:
      - description: Page size (1–100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque keyset cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.Page'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: List current user's links
      tags:
      - links
    post:
      consumes:
      - application/json
      description: Requires session cookie and Origin matching PUBLIC_ORIGIN, through
        the loopback Next.js proxy. Private responses are no-store. Normalized duplicates
        return the existing card without enqueueing again.
      parameters:
      - description: Submitted HTTP(S) URL
        in: body
        name: link
        required: true
        schema:
          $ref: '#/definitions/httpapi.saveLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Already saved
          schema:
            $ref: '#/definitions/httpapi.saveLinkResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.saveLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Save a link in the current user's library
      tags:
      - links
  /api/links/{id}:
    get:
      parameters:
      - description: Link UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.Card'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Get a saved link
      tags:
      - links
  /api/users/login:
    post:
      consumes:
      - application/json
      description: |-
        Email is trimmed and lowercased; passwords are compared exactly against Argon2id hashes.
        Issues a fresh HttpOnly, Secure, SameSite=Lax linkbook_session cookie. Server sessions expire after 24 hours.
        Unknown users and incorrect passwords return identical errors. Responses use Cache-Control: no-store.
      parameters:
      - description: Email and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/httpapi.loginRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: linkbook_session; HttpOnly; Secure; SameSite=Lax; Path=/
              type: string
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: invalid_request, invalid_email or invalid_password
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: invalid_credentials
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "415":
          description: unsupported_media_type
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Log in a user
      tags:
      - users
  /api/users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Get current user
      tags:
      - users
  /api/users/register:
    post:
      consumes:
      - application/json
      description: |-
        Email is trimmed and lowercased. Password accepts any characters, minimum 8 Unicode code points.
        Request body is limited to 1 MiB. Passwords and password hashes are never returned.
      parameters:
      - description: Email and password
        in: body
        name: registration
        required: true
        schema:
          $ref: '#/definitions/httpapi.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: invalid_request, invalid_email or invalid_password
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "409":
          description: email_exists
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "415":
          description: unsupported_media_type
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Register a user
      tags:
      - users
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
      summary: Check HTTP process health
      tags:
      - health
swagger: "2.0"
