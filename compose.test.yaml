name: linkbook-tests

services:
  postgres-test:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: linkbook_test
      POSTGRES_PASSWORD: linkbook_test_local
      POSTGRES_DB: linkbook_test
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbook_test -d linkbook_test"]
      interval: 2s
      timeout: 5s
      retries: 30
